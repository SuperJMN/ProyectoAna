# DotnetDeployer Configuration
# Desktop app with GitHub Releases (Windows setup + Linux deb)

version: 1

github:
  enabled: true
  owner: SuperJMN
  repo: ProyectoAna
  token:
    from: env
    name: GITHUB_TOKEN
  outputDir: artifacts
  packages:
    - project: EvaluacionesApp.Desktop/EvaluacionesApp.Desktop.csproj
      formats:
        - type: exe-setup
          arch: [x64]
        - type: deb
          arch: [x64]
